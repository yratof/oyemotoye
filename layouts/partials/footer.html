{{- $posts := where site.RegularPages "Section" "posts" }}
<footer class="site-footer" data-episode="hav">
  <ol class="index" role="list">
    {{- range $p := $posts }}
    <li class="index__row">
      <a class="index__name" href="{{ $p.RelPermalink }}">{{ $p.Title }}</a>
      <time class="index__date" datetime="{{ $p.Date.Format "2006-01-02" }}">{{ time.Format ":date_long" $p.Date }}</time>
    </li>
    {{- end }}
  </ol>
  <div class="site-footer__row">
    <span>&copy; {{ now.Year }} {{ site.Title }}</span>
    <a href="#top">{{ i18n "toTop" }} <span aria-hidden="true">↑</span></a>
  </div>
</footer>
